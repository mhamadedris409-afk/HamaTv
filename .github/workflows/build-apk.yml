name: Build Hama TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract Android project
        run: |
          mkdir hama_project
          unzip -o HamaTV_Android_APK_Project.zip -d hama_project

      - name: Build APK
        working-directory: hama_project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HamaTV-APK
          path: hama_project/app/build/outputs/apk/debug/app-debug.apk

